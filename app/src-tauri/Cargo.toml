[package]
name = "kairos"
version = "0.1.0"
description = "Kairos personal AI assistant, a desktop front end for Hermes Agent"
authors = ["HousseinTlili"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which matters on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pins (M1 §3). Tauri and serde follow the template's ranges; Cargo.lock pins them.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
# Windows Credential Manager only (D-008); other OS stores are added when Linux support starts.
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ulid = "=3.0.0"
thiserror = "=2.0.21"
# M3 §4: system readings (D-012).
sysinfo = "=0.39.6"
starship-battery = "=0.12.0"
# M3 §4: alert toasts.
tauri-plugin-notification = "=2.7.0"
# M3 §4: starting with Windows (D-013).
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
# M8 §2 (D-021): the quick box's global hotkey.
tauri-plugin-global-shortcut = "=2.4.1"
# M9 §4 (D-022): local speech to text (whisper.cpp, CPU), and the model download's hash check
# (sha2 was already in Cargo.lock through Tauri). Builds need CMake and libclang: .cargo/config.toml.
whisper-rs = "=0.16.0"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
# M3 §4: the session's lock state, for unlock detection. M9 Step 8 (D-025): LibraryLoader, to load
# the downloaded sherpa-onnx voice library at run time. Already in Cargo.lock through Tauri.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader"] }
# M4 §4: reading Windows notifications (UserNotificationListener, D-011). Already in Cargo.lock
# through Tauri and sysinfo.
windows = { version = "=0.62.2", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "UI_Notifications",
  "UI_Notifications_Management",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
